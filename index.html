<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Radar — AI-Powered Market Research</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #08080f;
      --surface:  #111120;
      --surface2: #18182c;
      --border:   #252540;
      --accent:   #7c6df0;
      --accent2:  #3ecfb8;
      --text:     #e4e4f0;
      --muted:    #7878a0;
      --error:    #f06d7c;
      --warn:     #f0b86d;
      --green:    #4ecb7a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(160deg, #0e0820 0%, #080f20 60%, #080808 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo-sub {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .header-actions { display: flex; gap: 8px; }

    .ghost-btn {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .ghost-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 20px 80px;
      gap: 0;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .tab {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.84rem;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    .tab:hover { border-color: var(--accent); color: var(--text); }
    .tab.active {
      background: linear-gradient(135deg, #5c4de8, #4a3cc8);
      border-color: transparent;
      color: #fff;
      font-weight: 600;
    }

    /* ── Conversation ── */
    #conversation { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }

    .msg-user {
      display: flex;
      justify-content: flex-end;
    }

    .msg-user-bubble {
      background: linear-gradient(135deg, #3a2fa0, #2a1f80);
      border: 1px solid #4a3fd0;
      border-radius: 16px 16px 4px 16px;
      padding: 12px 18px;
      max-width: 75%;
      font-size: 0.93rem;
      line-height: 1.55;
    }

    .msg-ai { display: flex; flex-direction: column; gap: 10px; }

    .msg-ai-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .ai-dot {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .msg-ai-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 20px 24px;
    }

    /* ── Sources ── */
    .sources-block {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      overflow: hidden;
    }

    .sources-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.8rem;
      color: var(--muted);
      user-select: none;
      transition: color 0.15s;
    }
    .sources-toggle:hover { color: var(--text); }

    .sources-toggle .arrow {
      margin-left: auto;
      font-size: 0.7rem;
      transition: transform 0.2s;
    }
    .sources-toggle.open .arrow { transform: rotate(180deg); }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 1px;
      border-top: 1px solid var(--border);
    }
    .sources-list.open { display: flex; }

    .source-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 14px;
      font-size: 0.8rem;
      text-decoration: none;
      color: var(--muted);
      transition: background 0.12s, color 0.12s;
    }
    .source-item:hover { background: var(--surface); color: var(--text); }

    .source-num {
      color: var(--accent2);
      font-weight: 600;
      flex-shrink: 0;
      font-size: 0.72rem;
      margin-top: 2px;
    }

    .source-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }

    .source-title {
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .source-url {
      color: var(--accent2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.73rem;
    }

    .source-age { color: var(--muted); font-size: 0.7rem; flex-shrink: 0; margin-left: auto; }

    /* ── Input area ── */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.15s;
      line-height: 1.55;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hint { font-size: 0.75rem; color: var(--muted); }

    .submit-btn {
      padding: 10px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Examples ── */
    .examples { margin-top: 14px; }

    .examples-title {
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 8px;
    }

    .examples-grid { display: flex; gap: 7px; flex-wrap: wrap; }

    .chip {
      padding: 6px 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 18px;
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .chip:hover { border-color: var(--accent2); color: var(--text); }

    /* ── Loading ── */
    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      color: var(--muted);
      font-size: 0.87rem;
    }
    .loading.on { display: flex; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Inline streaming card (active response) ── */
    #streaming-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 20px 24px;
    }
    #streaming-card.on { display: block; }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      margin-left: 1px;
      animation: blink 0.65s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Markdown ── */
    .md h1, .md h2, .md h3, .md h4 { margin: 1.3em 0 0.5em; }
    .md h2 { font-size: 1.1rem; color: var(--accent); }
    .md h3 { font-size: 0.97rem; color: var(--accent2); }
    .md h4 { font-size: 0.93rem; color: var(--text); }
    .md p { margin-bottom: 0.85em; }
    .md ul, .md ol { margin: 0.6em 0 0.9em 1.3em; }
    .md li { margin-bottom: 0.3em; }
    .md strong { color: #fff; font-weight: 600; }
    .md em { color: #b0b0cc; }
    .md a { color: var(--accent2); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md code {
      background: var(--surface2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.86em;
      color: var(--accent2);
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .md pre { background: var(--surface2); padding: 14px; border-radius: 8px; overflow-x: auto; margin: 0.9em 0; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { border-left: 3px solid var(--accent); padding-left: 14px; margin: 0.9em 0; color: var(--muted); }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.3em 0; }
    .md table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.88rem; }
    .md th { background: var(--surface2); padding: 8px 12px; text-align: left; border: 1px solid var(--border); color: var(--accent2); }
    .md td { padding: 7px 12px; border: 1px solid var(--border); color: var(--text); }
    .md tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    /* ── Status pill ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Welcome state ── */
    .welcome {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .welcome h2 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .welcome p { font-size: 0.93rem; max-width: 480px; margin: 0 auto 24px; line-height: 1.65; }
    .welcome-features { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .feature-badge {
      padding: 6px 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Error ── */
    .err {
      color: var(--error);
      background: rgba(240,109,124,0.07);
      border: 1px solid rgba(240,109,124,0.22);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 0.88rem;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .layout { padding: 20px 14px 70px; }
      .msg-user-bubble { max-width: 88%; }
      .msg-ai-card, #streaming-card { padding: 16px; }
      .tab { padding: 7px 12px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <div class="logo">◎ Market Radar</div>
      <div class="logo-sub">AI-powered global market research</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="ghost-btn" id="clear-btn" title="Clear conversation">Clear session</button>
  </div>
</header>

<div class="layout">

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="analyze">📊 Market Analysis</button>
    <button class="tab" data-tab="competitors">⚔️ Competitors</button>
    <button class="tab" data-tab="validate">✅ Validate Idea</button>
    <button class="tab" data-tab="deep">🔭 Deep Dive</button>
    <button class="tab" data-tab="crosscheck">🔍 Cross-Check</button>
  </div>

  <!-- Conversation history -->
  <div id="conversation"></div>

  <!-- Active streaming area -->
  <div class="msg-ai" id="streaming-wrap" style="display:none">
    <div class="msg-ai-header">
      <div class="ai-dot">◎</div>
      <span id="streaming-label">Analyzing...</span>
    </div>
    <div id="streaming-status"></div>
    <div id="streaming-card" class="md"></div>
  </div>

  <!-- Loading indicator -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span id="loading-txt">Searching the web...</span>
  </div>

  <!-- Input -->
  <div class="input-card">
    <textarea id="msg" placeholder="Describe your business idea, market, or question — I'll research it with real web data..."></textarea>
    <div class="input-footer">
      <span class="hint">Ctrl + Enter to submit</span>
      <button class="submit-btn" id="send-btn">Analyze →</button>
    </div>
  </div>

  <!-- Example queries -->
  <div class="examples">
    <div class="examples-title">Try an example</div>
    <div class="examples-grid" id="chips"></div>
  </div>

</div>

<script>
const TABS = {
  analyze: {
    label: 'Market Analysis',
    placeholder: 'Describe your business idea or the market you want to analyze...',
    btnText: 'Analyze →',
    loading: 'Searching for market data...',
    chips: [
      'AI-powered drone delivery startup — what does the market look like?',
      'B2B SaaS for restaurant inventory management — global opportunity?',
      'On-demand mental health app for Gen Z — market size and trends',
      'Climate tech: carbon credit marketplace opportunity',
    ],
  },
  competitors: {
    label: 'Competitor Analysis',
    placeholder: 'Describe the product or space you want to analyze competitors for...',
    btnText: 'Find Competitors →',
    loading: 'Researching competitors...',
    chips: [
      'Notion alternatives — who are the key competitors and their weaknesses?',
      'Compare top AI writing assistants: pricing, features, positioning',
      'Who are the main players in B2B HR software for SMEs?',
      'Competitive landscape for telemedicine platforms globally',
    ],
  },
  validate: {
    label: 'Idea Validation',
    placeholder: 'Describe your business idea in detail — I\'ll validate it against real market data...',
    btnText: 'Validate →',
    loading: 'Validating your idea with real data...',
    chips: [
      'A marketplace for freelance industrial designers — is there real demand?',
      'Subscription coffee tasting boxes — validate this business model',
      'AI-powered legal document review for startups — viable idea?',
      'Peer-to-peer tool rental platform — proceed, pivot, or stop?',
    ],
  },
  deep: {
    label: 'Deep Dive',
    placeholder: 'Name the sector or technology you want a deep-dive analysis on...',
    btnText: 'Deep Dive →',
    loading: 'Building comprehensive sector analysis...',
    chips: [
      'Deep dive into the global precision agriculture market',
      'Comprehensive analysis of the creator economy sector',
      'Web3 gaming industry — full sector report',
      'Buy Now Pay Later (BNPL) industry deep dive',
    ],
  },
  crosscheck: {
    label: 'Cross-Check',
    placeholder: 'Paste the claims or research you want fact-checked...',
    btnText: 'Cross-Check →',
    loading: 'Verifying claims against live data...',
    chips: [
      'The global e-learning market will reach $1 trillion by 2032',
      '95% of startups fail in the first year',
      'Gen Z spends more time on TikTok than YouTube',
      'Remote work has permanently shifted commercial real estate demand',
    ],
  },
};

let activeTab = 'analyze';
let busy = false;
let conversationHistory = []; // [{role, content}]
let messageCount = 0;

const msgEl       = document.getElementById('msg');
const sendBtn     = document.getElementById('send-btn');
const loadingEl   = document.getElementById('loading');
const loadTxt     = document.getElementById('loading-txt');
const convoEl     = document.getElementById('conversation');
const streamWrap  = document.getElementById('streaming-wrap');
const streamCard  = document.getElementById('streaming-card');
const streamLabel = document.getElementById('streaming-label');
const streamStatus= document.getElementById('streaming-status');
const chipsEl     = document.getElementById('chips');
const clearBtn    = document.getElementById('clear-btn');

// ── Tab switching ──
document.getElementById('tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) setTab(t.dataset.tab);
});

function setTab(id) {
  activeTab = id;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === id));
  const cfg = TABS[id];
  msgEl.placeholder = cfg.placeholder;
  sendBtn.textContent = cfg.btnText;
  renderChips();
}

function renderChips() {
  const list = TABS[activeTab]?.chips || [];
  chipsEl.innerHTML = list.map(c =>
    `<div class="chip" onclick="fillExample(this)">${c}</div>`
  ).join('');
}

window.fillExample = el => {
  msgEl.value = el.textContent;
  msgEl.focus();
};

// ── Clear session ──
clearBtn.addEventListener('click', () => {
  conversationHistory = [];
  messageCount = 0;
  convoEl.innerHTML = '';
  renderWelcome();
});

function renderWelcome() {
  if (conversationHistory.length === 0) {
    convoEl.innerHTML = `
      <div class="welcome">
        <h2>Research any market, instantly.</h2>
        <p>Ask about market size, find real competitors, validate your idea, or deep-dive into any sector — all backed by live web research with cited sources.</p>
        <div class="welcome-features">
          <span class="feature-badge">🌐 Real web search</span>
          <span class="feature-badge">📎 Cited sources</span>
          <span class="feature-badge">🔄 Session memory</span>
          <span class="feature-badge">⚔️ Competitor intel</span>
          <span class="feature-badge">✅ Idea validation</span>
        </div>
      </div>`;
  }
}

// ── Events ──
sendBtn.addEventListener('click', analyze);
msgEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); analyze(); }
});

// ── Analyze ──
async function analyze() {
  const msg = msgEl.value.trim();
  if (!msg || busy) return;

  busy = true;
  sendBtn.disabled = true;
  msgEl.value = '';

  // Remove welcome screen
  const welcome = convoEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  // Add user message to UI
  appendUserBubble(msg);

  // Show loading
  loadTxt.textContent = TABS[activeTab]?.loading || 'Analyzing...';
  loadingEl.classList.add('on');

  // Show streaming area
  streamLabel.textContent = TABS[activeTab]?.label || 'Analysis';
  streamStatus.innerHTML = '';
  streamCard.innerHTML = '';
  streamCard.classList.add('on');
  streamWrap.style.display = 'flex';

  let fullText = '';
  let sources = [];

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        tab: activeTab,
        history: conversationHistory,
      }),
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || `Server error ${res.status}`);
    }

    loadingEl.classList.remove('on');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let raw = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      raw += decoder.decode(value, { stream: true });

      // Extract and strip status markers
      raw = raw.replace(/<!--STATUS:([^-]+)-->/g, (_, msg) => {
        streamStatus.innerHTML = `<div class="status-pill"><div class="spinner" style="width:10px;height:10px;border-width:1.5px"></div>${escHtml(msg)}</div>`;
        return '';
      });

      // Extract and strip sources sentinel at end
      const srcMatch = raw.match(/<!--SOURCES:(\[[\s\S]*?\])-->$/);
      if (srcMatch) {
        try { sources = JSON.parse(srcMatch[1]); } catch {}
        raw = raw.replace(/<!--SOURCES:.*-->$/, '');
      }

      fullText = raw;
      streamCard.innerHTML = marked.parse(fullText) + '<span class="cursor"></span>';
      streamCard.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    streamStatus.innerHTML = '';
    streamCard.innerHTML = marked.parse(fullText);

    // Move streaming content into permanent conversation
    streamWrap.style.display = 'none';
    streamCard.classList.remove('on');
    appendAiMessage(fullText, sources);

    // Update conversation history
    conversationHistory.push({ role: 'user', content: msg });
    conversationHistory.push({ role: 'assistant', content: fullText });

  } catch (err) {
    loadingEl.classList.remove('on');
    streamWrap.style.display = 'none';
    streamCard.classList.remove('on');
    appendAiMessage(null, [], err.message);
  } finally {
    busy = false;
    sendBtn.disabled = false;
    msgEl.focus();
  }
}

function appendUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.innerHTML = `<div class="msg-user-bubble">${escHtml(text)}</div>`;
  convoEl.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function appendAiMessage(text, sources, errorMsg) {
  messageCount++;
  const wrap = document.createElement('div');
  wrap.className = 'msg-ai';

  const header = document.createElement('div');
  header.className = 'msg-ai-header';
  header.innerHTML = `<div class="ai-dot">◎</div><span>${TABS[activeTab]?.label || 'Analysis'}</span>`;

  wrap.appendChild(header);

  if (errorMsg) {
    const card = document.createElement('div');
    card.className = 'msg-ai-card';
    card.innerHTML = `<div class="err">⚠️ ${escHtml(errorMsg)}</div>`;
    wrap.appendChild(card);
  } else {
    const card = document.createElement('div');
    card.className = 'msg-ai-card md';
    card.innerHTML = marked.parse(text);
    wrap.appendChild(card);

    if (sources && sources.length > 0) {
      wrap.appendChild(buildSourcesBlock(sources));
    }
  }

  convoEl.appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function buildSourcesBlock(sources) {
  const block = document.createElement('div');
  block.className = 'sources-block';

  const toggle = document.createElement('div');
  toggle.className = 'sources-toggle';
  toggle.innerHTML = `
    <span>🔗</span>
    <span>${sources.length} source${sources.length > 1 ? 's' : ''} used</span>
    <span class="arrow">▼</span>`;

  const list = document.createElement('div');
  list.className = 'sources-list';

  sources.forEach((s, i) => {
    const a = document.createElement('a');
    a.className = 'source-item';
    a.href = s.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';

    let domain = s.url;
    try { domain = new URL(s.url).hostname.replace('www.', ''); } catch {}

    a.innerHTML = `
      <span class="source-num">${i + 1}</span>
      <span class="source-info">
        <span class="source-title">${escHtml(s.title || domain)}</span>
        <span class="source-url">${escHtml(domain)}</span>
      </span>
      ${s.page_age ? `<span class="source-age">${escHtml(s.page_age)}</span>` : ''}`;
    list.appendChild(a);
  });

  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    list.classList.toggle('open');
  });

  block.appendChild(toggle);
  block.appendChild(list);
  return block;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Init
setTab('analyze');
renderWelcome();
</script>
