<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Market Radar — AI-Powered Market Research</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:       #08080f;
      --surface:  #111120;
      --surface2: #18182c;
      --border:   #252540;
      --accent:   #7c6df0;
      --accent2:  #3ecfb8;
      --text:     #e4e4f0;
      --muted:    #7878a0;
      --error:    #f06d7c;
      --warn:     #f0b86d;
      --green:    #4ecb7a;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(160deg, #0e0820 0%, #080f20 60%, #080808 100%);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .header-left { display: flex; align-items: center; gap: 14px; }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent) 30%, var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo-sub {
      font-size: 0.78rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .header-actions { display: flex; gap: 8px; }

    .ghost-btn {
      padding: 7px 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      cursor: pointer;
      font-family: inherit;
      transition: border-color 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .ghost-btn:hover { border-color: var(--accent); color: var(--text); }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      max-width: 900px;
      margin: 0 auto;
      padding: 28px 20px 80px;
      gap: 0;
    }

    /* ── Conversation ── */
    #conversation { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }

    .msg-user {
      display: flex;
      justify-content: flex-end;
    }

    .msg-user-bubble {
      background: linear-gradient(135deg, #3a2fa0, #2a1f80);
      border: 1px solid #4a3fd0;
      border-radius: 16px 16px 4px 16px;
      padding: 12px 18px;
      max-width: 75%;
      font-size: 0.93rem;
      line-height: 1.55;
    }

    .msg-ai { display: flex; flex-direction: column; gap: 10px; }

    .msg-ai-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .ai-dot {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      flex-shrink: 0;
    }

    .msg-ai-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 20px 24px;
    }

    /* ── Sources (inline pills) ── */
    .sources-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 0 4px;
    }

    .sources-label {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      flex-shrink: 0;
      margin-right: 2px;
    }

    .src-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.73rem;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      max-width: 170px;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: border-color 0.15s, color 0.15s;
    }
    .src-chip:hover { border-color: var(--accent2); color: var(--text); }
    .src-chip.trusted { border-color: rgba(62,207,184,0.3); color: #a0e8df; }

    .src-chip-more {
      font-size: 0.72rem;
      color: var(--muted);
      cursor: pointer;
      padding: 3px 9px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: transparent;
      font-family: inherit;
      transition: color 0.15s, border-color 0.15s;
    }
    .src-chip-more:hover { color: var(--text); border-color: var(--muted); }

    /* ── Source Analysis section ── */
    .source-analysis {
      border-top: 1px solid var(--border);
      margin-top: 10px;
      padding-top: 8px;
    }
    .sa-title-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }
    .sa-title {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.09em;
    }
    .sa-vcount {
      font-size: 0.7rem;
      color: var(--green);
      padding: 1px 7px;
      background: rgba(78,203,122,0.08);
      border: 1px solid rgba(78,203,122,0.25);
      border-radius: 8px;
    }
    .sa-stats {
      display: flex;
      gap: 12px;
      font-size: 0.71rem;
      color: var(--muted);
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .sa-explanation {
      font-size: 0.7rem;
      color: #5a5a80;
      line-height: 1.55;
      margin-bottom: 6px;
      font-style: italic;
    }
    .t-verified { color: var(--green); }
    .t-warn { color: var(--warn); }
    .t-cached {
      font-size: 0.7rem;
      color: var(--accent2);
      padding: 2px 8px;
      background: rgba(62,207,184,0.08);
      border: 1px solid rgba(62,207,184,0.2);
      border-radius: 8px;
      margin-left: auto;
    }

    /* ── Input area ── */
    .input-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 18px;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.15s;
      line-height: 1.55;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    textarea::placeholder { color: var(--muted); }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hint { font-size: 0.75rem; color: var(--muted); }

    .submit-btn {
      padding: 10px 24px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }
    .submit-btn:hover:not(:disabled) { opacity: 0.88; transform: translateY(-1px); }
    .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Follow-up buttons ── */
    .follow-btns {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      padding: 8px 0 2px;
    }

    .follow-btn {
      padding: 5px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      font-family: inherit;
      line-height: 1.5;
    }
    .follow-btn:nth-child(3n+1) { border-color: rgba(124,109,240,0.35); color: #9b8ef5; }
    .follow-btn:nth-child(3n+1):hover { border-color: var(--accent); color: #c0b0ff; background: rgba(124,109,240,0.08); }
    .follow-btn:nth-child(3n+2) { border-color: rgba(62,207,184,0.35); color: #5dd6c8; }
    .follow-btn:nth-child(3n+2):hover { border-color: var(--accent2); color: #90ede4; background: rgba(62,207,184,0.08); }
    .follow-btn:nth-child(3n+3) { border-color: rgba(240,184,109,0.35); color: #e8b86a; }
    .follow-btn:nth-child(3n+3):hover { border-color: var(--warn); color: #f0cc8a; background: rgba(240,184,109,0.08); }

    /* ── Trust score badge ── */
    .trust-badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 8px;
      white-space: nowrap;
    }
    .trust-high { background: rgba(78,203,122,0.1); border: 1px solid rgba(78,203,122,0.3); color: var(--green); }
    .trust-med  { background: rgba(240,184,109,0.1); border: 1px solid rgba(240,184,109,0.3); color: var(--warn); }
    .trust-low  { background: rgba(240,109,124,0.1); border: 1px solid rgba(240,109,124,0.3); color: var(--error); }

    /* ── Loading ── */
    .loading {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 14px 0;
      color: var(--muted);
      font-size: 0.87rem;
    }
    .loading.on { display: flex; }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Inline streaming card (active response) ── */
    #streaming-card {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px 16px 16px 16px;
      padding: 20px 24px;
    }
    #streaming-card.on { display: block; }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      margin-left: 1px;
      animation: blink 0.65s step-end infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── Markdown ── */
    .md h1, .md h2, .md h3, .md h4 { margin: 1.3em 0 0.5em; }
    .md h2 { font-size: 1.1rem; color: var(--accent); }
    .md h3 { font-size: 0.97rem; color: var(--accent2); }
    .md h4 { font-size: 0.93rem; color: var(--text); }
    .md p { margin-bottom: 0.85em; }
    .md ul, .md ol { margin: 0.6em 0 0.9em 1.3em; }
    .md li { margin-bottom: 0.3em; }
    .md strong { color: #fff; font-weight: 600; }
    .md em { color: #b0b0cc; }
    .md a { color: var(--accent2); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md code {
      background: var(--surface2);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.86em;
      color: var(--accent2);
      font-family: 'SF Mono', 'Fira Code', monospace;
    }
    .md pre { background: var(--surface2); padding: 14px; border-radius: 8px; overflow-x: auto; margin: 0.9em 0; }
    .md pre code { background: none; padding: 0; }
    .md blockquote { border-left: 3px solid var(--accent); padding-left: 14px; margin: 0.9em 0; color: var(--muted); }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 1.3em 0; }
    .md table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 0.88rem; }
    .md th { background: var(--surface2); padding: 8px 12px; text-align: left; border: 1px solid var(--border); color: var(--accent2); }
    .md td { padding: 7px 12px; border: 1px solid var(--border); color: var(--text); }
    .md tr:nth-child(even) td { background: rgba(255,255,255,0.02); }

    /* ── Status pill ── */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.75rem;
      color: var(--muted);
      margin-bottom: 10px;
    }

    /* ── Welcome state ── */
    .welcome {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
    }
    .welcome h2 {
      font-size: 1.6rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }
    .welcome p { font-size: 0.93rem; max-width: 480px; margin: 0 auto 24px; line-height: 1.65; }
    .welcome-features { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .feature-badge {
      padding: 6px 13px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Error ── */
    .err {
      color: var(--error);
      background: rgba(240,109,124,0.07);
      border: 1px solid rgba(240,109,124,0.22);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 0.88rem;
    }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      header { padding: 14px 16px; }
      .layout { padding: 20px 14px 70px; }
      .msg-user-bubble { max-width: 88%; }
      .msg-ai-card, #streaming-card { padding: 16px; }
      .tab { padding: 7px 12px; font-size: 0.8rem; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <div>
      <div class="logo">◎ Market Radar</div>
      <div class="logo-sub">AI-powered global market research</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="ghost-btn" id="clear-btn" title="Clear conversation">Clear session</button>
  </div>
</header>

<div class="layout">

  <!-- Conversation history -->
  <div id="conversation"></div>

  <!-- Active streaming area -->
  <div class="msg-ai" id="streaming-wrap" style="display:none">
    <div class="msg-ai-header">
      <div class="ai-dot">◎</div>
      <span id="streaming-label">Analyzing...</span>
    </div>
    <div id="streaming-status"></div>
    <div id="streaming-card" class="md"></div>
  </div>

  <!-- Loading indicator -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <span id="loading-txt">Searching the web...</span>
  </div>

  <!-- Input -->
  <div class="input-card">
    <textarea id="msg" placeholder="Describe your business idea, market, or question — I'll research it with real web data..."></textarea>
    <div class="input-footer">
      <span class="hint">Ctrl + Enter to submit</span>
      <button class="submit-btn" id="send-btn">Analyze →</button>
    </div>
  </div>


</div>

<script>
const TABS = {
  analyze: {
    label: 'Market Analysis',
    placeholder: 'Describe your business idea or the market you want to analyze...',
    btnText: 'Analyze →',
    loading: 'Searching for market data...',
  },
  competitors: {
    label: 'Competitor Analysis',
    placeholder: 'Describe the product or space you want to analyze competitors for...',
    btnText: 'Find Competitors →',
    loading: 'Researching competitors...',
  },
  validate: {
    label: 'Idea Validation',
    placeholder: 'Describe your business idea in detail — I\'ll validate it against real market data...',
    btnText: 'Validate →',
    loading: 'Validating your idea with real data...',
  },
  deep: {
    label: 'Deep Dive',
    placeholder: 'Name the sector or technology you want a deep-dive analysis on...',
    btnText: 'Deep Dive →',
    loading: 'Building comprehensive sector analysis...',
  },
  crosscheck: {
    label: 'Cross-Check',
    placeholder: 'Paste the claims or research you want fact-checked...',
    btnText: 'Cross-Check →',
    loading: 'Verifying claims against live data...',
  },
};

let activeTab = 'analyze';
let busy = false;
let conversationHistory = [];
let messageCount = 0;

// Session cache: key = `${tab}:${normalizedMsg}` → {text, sources, meta}
const searchCache = new Map();

function getCacheKey(tab, msg) {
  return `${tab}:${msg.toLowerCase().replace(/\s+/g, ' ').trim()}`;
}

// Mirror of backend classifier — determines search depth label shown to user
function classifyDepth(msg) {
  const lower = msg.toLowerCase();
  const deepSignals = ['analyze','analysis','comprehensive','deep dive','compare','landscape',
    'sector','industry','market','competitive','validate','report','trends','forecast',
    'projection','strategy','opportunities','challenges','full','complete','overview','research'];
  const simpleSignals = ['what is','what are','who is','when was','when did','where is',
    'how much does','how many','define','definition','price of','cost of','founded','headquarters'];
  const hasDeep = deepSignals.some(k => lower.includes(k));
  const hasSimple = simpleSignals.some(k => lower.includes(k));
  if (hasSimple && !hasDeep && msg.length < 120) return 'simple';
  if (hasDeep || msg.length > 150) return 'deep';
  return 'moderate';
}

// Frontend source quality classifier (mirrors backend)
const TRUSTED_DOMAINS_FE = new Set([
  'reuters.com','bloomberg.com','wsj.com','ft.com','economist.com','apnews.com',
  'bbc.com','nytimes.com','theguardian.com','techcrunch.com','wired.com','forbes.com',
  'businessinsider.com','cnbc.com','hbr.org','mckinsey.com','bcg.com','statista.com',
  'cbinsights.com','crunchbase.com','pitchbook.com','gartner.com','worldbank.org',
  'imf.org','oecd.org','nature.com','arxiv.org','investopedia.com','wikipedia.org',
]);
function classifySourceFE(url) {
  try {
    const domain = new URL(url).hostname.replace('www.', '');
    return TRUSTED_DOMAINS_FE.has(domain) ? 'trusted' : 'neutral';
  } catch { return 'neutral'; }
}

const msgEl       = document.getElementById('msg');
const sendBtn     = document.getElementById('send-btn');
const loadingEl   = document.getElementById('loading');
const loadTxt     = document.getElementById('loading-txt');
const convoEl     = document.getElementById('conversation');
const streamWrap  = document.getElementById('streaming-wrap');
const streamCard  = document.getElementById('streaming-card');
const streamLabel = document.getElementById('streaming-label');
const streamStatus= document.getElementById('streaming-status');
const clearBtn    = document.getElementById('clear-btn');


// ── Clear session ──
clearBtn.addEventListener('click', () => {
  conversationHistory = [];
  messageCount = 0;
  searchCache.clear();
  convoEl.innerHTML = '';
  renderWelcome();
});


function renderWelcome() {
  if (conversationHistory.length === 0) {
    convoEl.innerHTML = `
      <div class="welcome">
        <h2>Research any market, instantly.</h2>
        <p>Ask about market size, find real competitors, validate your idea, or deep-dive into any sector — all backed by live web research with cited sources.</p>
        <div class="welcome-features">
          <span class="feature-badge">🌐 Real web search</span>
          <span class="feature-badge">📎 Cited sources</span>
          <span class="feature-badge">🔄 Session memory</span>
          <span class="feature-badge">⚔️ Competitor intel</span>
          <span class="feature-badge">✅ Idea validation</span>
        </div>
      </div>`;
  }
}

// ── Events ──
sendBtn.addEventListener('click', analyze);
msgEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); analyze(); }
});

// ── Analyze ──
async function analyze() {
  const msg = msgEl.value.trim();
  if (!msg || busy) return;

  busy = true;
  sendBtn.disabled = true;
  msgEl.value = '';

  const welcome = convoEl.querySelector('.welcome');
  if (welcome) welcome.remove();

  appendUserBubble(msg);

  // Check session cache first
  const cacheKey = getCacheKey(activeTab, msg);
  const cached = searchCache.get(cacheKey);
  if (cached) {
    appendAiMessage(cached.text, cached.sources, cached.meta, null, true, msg);
    conversationHistory.push({ role: 'user', content: msg });
    conversationHistory.push({ role: 'assistant', content: cached.text });
    busy = false;
    sendBtn.disabled = false;
    msgEl.focus();
    return;
  }

  const depth = classifyDepth(msg);
  const depthLabel = depth === 'simple' ? '🔍 Quick search' : depth === 'deep' ? '🔭 Deep research' : '🔎 Standard search';

  loadTxt.textContent = TABS[activeTab]?.loading || 'Analyzing...';
  loadingEl.classList.add('on');

  streamLabel.textContent = `${TABS[activeTab]?.label || 'Analysis'} · ${depthLabel}`;
  streamStatus.innerHTML = '';
  streamCard.innerHTML = '';
  streamCard.classList.add('on');
  streamWrap.style.display = 'flex';

  let fullText = '';
  let sources = [];
  let meta = null;

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: msg,
        tab: activeTab,
        history: conversationHistory,
      }),
    });

    if (!res.ok) {
      const errText = await res.text();
      throw new Error(errText || `Server error ${res.status}`);
    }

    loadingEl.classList.remove('on');

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let raw = '';

    function extractData(str) {
      // Greedy match — finds the LAST --> in string, safe when JSON contains -->
      const m = str.match(/<!--DATA:([\s\S]+)-->[\s]*$/);
      if (!m) return str;
      try {
        const data = JSON.parse(m[1]);
        sources = data.sources || [];
        meta = data.meta || null;
      } catch { /* keep meta null */ }
      return str.replace(/<!--DATA:[\s\S]+-->[\s]*$/, '');
    }

    while (true) {
      const { done, value } = await reader.read();
      if (done) {
        // Flush decoder and do a final DATA sentinel check
        raw += decoder.decode();
        raw = extractData(raw);
        break;
      }
      raw += decoder.decode(value, { stream: true });

      // Status markers
      raw = raw.replace(/<!--STATUS:([^-]+)-->/g, (_, statusMsg) => {
        streamStatus.innerHTML = `<div class="status-pill"><div class="spinner" style="width:10px;height:10px;border-width:1.5px"></div>${escHtml(statusMsg)}</div>`;
        return '';
      });

      raw = extractData(raw);

      fullText = raw;
      streamCard.innerHTML = marked.parse(fullText) + '<span class="cursor"></span>';
      streamCard.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }

    streamStatus.innerHTML = '';
    // Hide streaming area and immediately show final message (no intermediate re-render to avoid flash)
    streamWrap.style.display = 'none';
    streamCard.classList.remove('on');
    streamCard.innerHTML = '';
    appendAiMessage(fullText, sources, meta, null, false, msg);

    // Cache the result for this session
    searchCache.set(cacheKey, { text: fullText, sources, meta });

    conversationHistory.push({ role: 'user', content: msg });
    conversationHistory.push({ role: 'assistant', content: fullText });

  } catch (err) {
    loadingEl.classList.remove('on');
    streamWrap.style.display = 'none';
    streamCard.classList.remove('on');
    appendAiMessage(null, [], null, err.message, false, '');
  } finally {
    busy = false;
    sendBtn.disabled = false;
    msgEl.focus();
  }
}

function appendUserBubble(text) {
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.innerHTML = `<div class="msg-user-bubble">${escHtml(text)}</div>`;
  convoEl.appendChild(div);
  div.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function appendAiMessage(text, sources, meta, errorMsg, fromCache, userQuery) {
  messageCount++;
  const wrap = document.createElement('div');
  wrap.className = 'msg-ai';

  const header = document.createElement('div');
  header.className = 'msg-ai-header';
  header.innerHTML = `<div class="ai-dot">◎</div><span>${TABS[activeTab]?.label || 'Analysis'}</span>`;
  wrap.appendChild(header);

  if (errorMsg) {
    const card = document.createElement('div');
    card.className = 'msg-ai-card';
    card.innerHTML = `<div class="err">⚠️ ${escHtml(errorMsg)}</div>`;
    wrap.appendChild(card);
  } else {
    const card = document.createElement('div');
    card.className = 'msg-ai-card md';
    card.innerHTML = marked.parse(text);
    wrap.appendChild(card);

    // Always show Source Analysis — use fallback meta if DATA sentinel wasn't received
    const effectiveMeta = meta || { scanned: 0, verified: 0, conflicting: 0, searchCount: 0, depth: 'unknown' };
    const footer = buildSourcesUI(sources || [], effectiveMeta, fromCache);
    if (footer) wrap.appendChild(footer);

    // Dynamic follow-up buttons — skip for simple queries and cached responses
    const depth = classifyDepth(userQuery || '');
    if (depth !== 'simple') {
      const btnsContainer = document.createElement('div');
      btnsContainer.className = 'follow-btns';
      wrap.appendChild(btnsContainer);
      fetchSuggestions(text, activeTab, userQuery || '', btnsContainer);
    }
  }

  convoEl.appendChild(wrap);
  wrap.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function fetchSuggestions(responseText, tab, userQuery, container) {
  try {
    const res = await fetch('/api/suggestions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ responseText, tab, userQuery }),
    });
    if (!res.ok) return;
    const data = await res.json();
    const buttons = data.buttons || [];
    if (buttons.length === 0) return;

    buttons.forEach(btn => {
      const el = document.createElement('button');
      el.className = 'follow-btn';
      el.textContent = btn.label;
      el.addEventListener('click', () => {
        if (busy) return;
        msgEl.value = btn.query;
        msgEl.focus();
        analyze();
      });
      container.appendChild(el);
    });

    container.scrollIntoView({ behavior: 'smooth', block: 'end' });
  } catch { /* silent — buttons are optional */ }
}

function buildSourceExplanation(scanned, verified, conflicting, searchCount) {
  if (searchCount === 0 || scanned === 0) {
    return 'AI bu yanıt için internet araması yapmadı — kendi eğitim verisinden yanıtladı. Veriler güncel olmayabilir.';
  }
  const parts = [];
  const neutral = scanned - verified;
  if (verified > 0) {
    parts.push(`${verified} kaynak bilinen güvenilir yayın (Reuters, Bloomberg vb.) — alan adı tanındı. Not: alan adı tanınmış olmak, iddiaların birden fazla bağımsız kaynakta teyit edildiği anlamına gelmez.`);
  }
  if (neutral > 0) {
    parts.push(`${neutral} kaynak genel web — bağımsız teyit edilmedi, daha temkinli değerlendirilmeli.`);
  }
  if (conflicting > 0) {
    parts.push(`${conflicting} noktada kaynaklar farklı rakam bildirdi; yanıtta ⚠️ ile işaretlendi.`);
  }
  return parts.join(' ');
}

function buildSourcesUI(sources, meta, fromCache) {
  if (!meta) return null;

  const scanned = meta?.scanned ?? sources.length;
  const verified = meta?.verified ?? 0;
  const conflicting = meta?.conflicting ?? 0;
  const searchCount = meta?.searchCount ?? 0;

  const trustClass = verified >= 2 ? 'trust-high' : verified === 1 ? 'trust-med' : 'trust-low';
  const trustText  = verified >= 2 ? '✅ Verified' : verified === 1 ? '⚠️ Single source' : '❌ No sources';

  const container = document.createElement('div');

  // ── Source Analysis header ──
  const sa = document.createElement('div');
  sa.className = 'source-analysis';

  const titleRow = document.createElement('div');
  titleRow.className = 'sa-title-row';
  titleRow.innerHTML = `<span class="sa-title">Source Analysis</span>`
    + (verified > 0 ? `<span class="sa-vcount">${verified} verified</span>` : '')
    + (fromCache ? `<span class="t-cached">⚡ cached</span>` : '');
  sa.appendChild(titleRow);

  const statsRow = document.createElement('div');
  statsRow.className = 'sa-stats';
  statsRow.innerHTML = (searchCount === 0
    ? `<span style="color:var(--warn)">⚠️ İnternet araması yapılmadı — eğitim verisi kullanıldı</span>`
    : `<span>📡 ${scanned} scanned</span>`
      + `<span class="t-verified">✅ ${verified} verified</span>`
      + (conflicting > 0 ? `<span class="t-warn">⚠️ ${conflicting} conflicting</span>` : ''));
  sa.appendChild(statsRow);

  const explanation = buildSourceExplanation(scanned, verified, conflicting, searchCount);
  if (explanation) {
    const expEl = document.createElement('div');
    expEl.className = 'sa-explanation';
    expEl.textContent = explanation;
    sa.appendChild(expEl);
  }

  // ── Source pills ──
  if (sources.length > 0) {
    const row = document.createElement('div');
    row.className = 'sources-row';

    const lbl = document.createElement('span');
    lbl.className = 'sources-label';
    lbl.textContent = '🔗 Sources:';
    row.appendChild(lbl);

    const MAX_VISIBLE = 5;
    const visible = sources.slice(0, MAX_VISIBLE);
    const overflow = sources.slice(MAX_VISIBLE);

    const makeChip = s => {
      const a = document.createElement('a');
      const quality = s.quality || classifySourceFE(s.url);
      a.className = `src-chip${quality === 'trusted' ? ' trusted' : ''}`;
      a.href = s.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      let domain = s.url;
      try { domain = new URL(s.url).hostname.replace('www.', ''); } catch {}
      const chipLabel = s.title && s.title !== s.url
        ? s.title.replace(/\s*[-|].*$/, '').trim().slice(0, 40)
        : domain;
      a.title = s.title || domain;
      a.textContent = chipLabel;
      return a;
    };

    visible.forEach(s => row.appendChild(makeChip(s)));

    if (overflow.length > 0) {
      const moreBtn = document.createElement('button');
      moreBtn.className = 'src-chip-more';
      moreBtn.textContent = `+${overflow.length} more`;
      moreBtn.addEventListener('click', () => {
        moreBtn.remove();
        overflow.forEach(s => row.appendChild(makeChip(s)));
      });
      row.appendChild(moreBtn);
    }

    sa.appendChild(row);
  }

  container.appendChild(sa);
  return container;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// Init
renderWelcome();

</script>
